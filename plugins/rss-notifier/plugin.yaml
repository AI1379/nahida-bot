id: rss-notifier
name: "RSS Notifier"
version: "0.1.0"
description: "Poll RSS/Atom feeds and push new items to chat addresses"
entrypoint: "nahida_plugin_rss_notifier.plugin:RSSNotifierPlugin"
load_phase: "post-agent"
enabled: true

permissions:
  network:
    outbound:
      - "*"
  plugin_data:
    read: true
    write: true

config:
  target_chat_addresses: []
  feeds: []
  polling:
    enabled: true
    interval_seconds: 300
    initial_delay_seconds: 10
    timeout_seconds: 20
    max_feed_bytes: 1000000
    max_items_per_feed: 20
    max_known_items_per_feed: 200
    max_new_items_per_feed_per_poll: 5
    user_agent: "nahida-bot-rss-notifier/0.1"
  rendering:
    mode: "standard"
    max_text_chars: 500
    max_paragraphs: 3
    include_images: true
    max_images: 1
    send_image_attachments: true
    image_download_timeout_seconds: 20
    max_image_bytes: 5000000
  registration:
    enabled: true

config_schema:
  type: object
  properties:
    target_chat_addresses:
      type: array
      items:
        type: string
      description: "Default typed chat addresses used by feeds that do not define their own targets"
    feeds:
      type: array
      items:
        type: object
        required: ["url"]
        properties:
          url:
            type: string
          title:
            type: string
          target_chat_addresses:
            type: array
            items:
              type: string
    polling:
      type: object
      properties:
        enabled:
          type: boolean
        interval_seconds:
          type: integer
          minimum: 10
        initial_delay_seconds:
          type: number
          minimum: 0
        timeout_seconds:
          type: number
          minimum: 1
        max_feed_bytes:
          type: integer
          minimum: 1024
        max_items_per_feed:
          type: integer
          minimum: 1
        max_known_items_per_feed:
          type: integer
          minimum: 1
        max_new_items_per_feed_per_poll:
          type: integer
          minimum: 1
        user_agent:
          type: string
    rendering:
      type: object
      properties:
        mode:
          type: string
          enum: ["compact", "standard", "rich"]
        max_text_chars:
          type: integer
          minimum: 0
        max_paragraphs:
          type: integer
          minimum: 0
        include_images:
          type: boolean
        max_images:
          type: integer
          minimum: 0
        send_image_attachments:
          type: boolean
        image_download_timeout_seconds:
          type: number
          minimum: 1
        max_image_bytes:
          type: integer
          minimum: 1024
    registration:
      type: object
      properties:
        enabled:
          type: boolean
