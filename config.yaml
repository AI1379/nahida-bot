# 权限至少勾选：读取单聊消息（im:message.p2p_msg:readonly）、
# 获取群组中用户@机器人消息（im:message.group_at_msg:readonly），
# 以及发送消息/上传图片文件/获取群信息/获取群成员列表等按文档页要求的权限。
# 依赖安装：uv sync --group feishu
#
# feishu:
#   enabled: true
#   app_id: "${FEISHU_APP_ID:}"          # cli_ 开头的应用 ID
#   app_secret: "${FEISHU_APP_SECRET:}"
#   # domain: "https://open.feishu.cn"   # 国际版 Lark 改为 https://open.larksuite.com
#   command_prefix: "/"
#   group_trigger_mode: "mention"        # none / mention / command / always
#   # 群上下文捕获（conversation_joiner 的输入）。注意：需要申请敏感权限
#   # 「获取群组中所有消息 im:message.group_msg」（管理员审批）；未申请时平台
#   # 只推送 @机器人 的消息，此开关不会有实际效果。
#   group_context_capture: false
#   reply_to_inbound: null               # true/false 覆盖 router.reply_to_inbound
#   allowed_chats: []                    # chat_id（oc_ 开头）白名单；空 = 不限
#   allowed_users: []                    # 单聊发送者 open_id（ou_ 开头）白名单；空 = 不限
#   send_retry_attempts: 3
#   send_retry_backoff: 1.5
#   max_text_length: 3500                # 分片阈值（post/卡片硬上限 30KB）
#   markdown_enabled: true               # 出站 Markdown 渲染为富文本（post）
#   outbound_mentions_enabled: true      # 出站 [CQ:at,qq=ou_xxx] token → 真 @（群成员校验）
#   max_mentions_per_message: 3
#   member_cache_seconds: 1800           # 群成员缓存（mention 校验 + 发言者名字共用）
#   media_download_dir: "./data/temp/media"
#   enable_media_download_tool: true
#   cache_media_on_receive: true

# GitHub Channel（可选）
# 将 GitHub 仓库作为聊天平台：issue/PR 的评论与事件经 webhook 进入会话，
# bot 的回复以 issue 评论形式发出；同时注册 github_* issue 管理工具。
# 前置条件：
#   1. 需要 webapi.enabled: true，且 /webhooks/<path> 对 GitHub 可达
#      （服务器需公网暴露或反向代理；入口防线是 HMAC 签名校验）。
#   2. 建一个 PAT（classic 需 repo scope；fine-granted 授予目标仓库的
#      issues 读写作即可），写入 .env 的 GITHUB_TOKEN。
#   3. 仓库 webhook 配置指向 http(s)://<host>:<port>/webhooks/github，
#      Content type 选 application/json，Secret 与 GITHUB_WEBHOOK_SECRET 一致，
#      订阅 Issues / Issue comments / Pull requests / Pull request reviews。
# 注意：github-notifier 插件若启用并占用同一路径会在加载时冲突报错。
#
# github:
#   enabled: true
#   token: "${GITHUB_TOKEN:}"             # PAT；留空则 REST 匿名（60 req/h）
#   webhook_secret: "${GITHUB_WEBHOOK_SECRET:}"  # 必填（fail-closed，缺失时拒绝非 ping 事件）
#   # webhook_path: "github"              # 最终路径 /webhooks/github
#   # api_base_url: "https://api.github.com"  # GitHub Enterprise Server 改这里
#   # bot_login: ""                       # bot 用户名；留空则启动时 GET /user 自动发现
#   allowed_repos: ["AI1379/nahida-bot"]  # 仓库白名单 owner/name；支持 org/* 通配整组织；空 = token 可见的全部
#   # allowed_senders: []                 # 发送者 login 白名单；空 = 不按名单限制（bot 自身始终跳过）
#   # allowed_orgs: []                    # 组织白名单：任一组织的成员自动放行（API 查询 + 30 分钟缓存）；
#   #                                     # 留空则完全不发起组织判定。注意：查隐藏成员需要组织 owner 的 PAT
#   # group_trigger_mode: "mention"       # 默认仅 @bot 时响应；none/mention/command/always
#   # group_context_capture: false        # 未触发事件是否记录为旁听上下文
#   # reply_to_inbound: null
#   # include_reasoning: false            # 公开仓库默认不附带思考过程
#   # lifecycle_as_context: true          # issue/PR 关闭、重开作为旁听上下文
#   # enable_issue_tools: true            # 注册 github_* 工具（改状态的工具仅 admin 可用）

# Discord Channel（可选）
# 启用前需在 Discord Developer Portal 创建 Bot、开启 Message Content Intent
# （Privileged Intent，必须在后台手动开启），并执行 `uv sync --group discord`。
#
# discord:
#   enabled: true
#   bot_token: "${DISCORD_BOT_TOKEN:}"
#   # proxy: "${DISCORD_PROXY:}"       # HTTP/SOCKS 代理（国内部署通常需要）
#   group_trigger_mode: "mention"      # 服务器频道/Thread 内默认 @bot 触发
#   group_context_capture: false
#   reply_to_inbound: null
#   allowed_guilds: []                 # 服务器 ID 白名单；空列表表示不限制（DM 不受此限制）
#   allowed_dm_users: []               # 私信用户 ID 白名单；空列表表示不限制
#   blocked_channels: []               # 在允许的服务器内排除特定频道/Thread
#   register_slash_commands: true       # 将已注册的 / 命令同步为 Discord 原生 slash command
#                                       # （服务器级、即时生效；带 choices/completer 的参数获得原生补全）
#   media_download_dir: "./data/temp/media"

# ── Agent Loop ──────────────────────────────────────────
# 控制 Agent 循环的行为：迭代轮数、超时、重试策略等。
# 以下均为默认值，不写则使用默认值。
#
# agent:
#   max_steps: 8                        # 最大工具调用迭代轮数
#   provider_timeout_seconds: 120.0     # 单次 LLM 调用超时（秒）
#   retry_attempts: 2                   # LLM 调用重试次数
#   retry_backoff_seconds: 0.2          # 重试退避间隔（秒）
#   tool_timeout_seconds: 135.0         # 工具执行超时（秒）
#   tool_retry_attempts: 1              # 工具执行重试次数
#   tool_retry_backoff_seconds: 0.1     # 工具重试退避间隔（秒）
#   max_tool_log_chars: 400             # 工具日志截断长度
#   subagent_notifications_enabled: false  # 默认仅回传主任务；true 才向来源聊天推送通知
#   # tool_use_system_prompt: "..."     # 注入的工具使用提示
#   # provider_error_template: "..."    # Provider 错误消息模板

# ── Agent Runtime（canonical ledger，修复 #24 地基）─────────
# Phase 1：best-effort 把每个 run 的 canonical 事件流与执行回执落库（附加双写，
# 不改对外行为）。reading/重放端属 Phase 5。默认代码里为 false；这里置 true 以采集数据。

agent:
  max_steps: 240                        # ★ 注意：默认 8，这里很大；非长任务建议先降到 20–40
  provider_timeout_seconds: 120.0       # 单次 LLM 调用超时（秒）
  retry_attempts: 2                     # LLM 调用重试次数
  retry_backoff_seconds: 0.2            # 重试退避间隔（秒）
  tool_timeout_seconds: 135.0           # 工具执行超时（秒）
  tool_retry_attempts: 1                # 工具执行重试次数
  tool_retry_backoff_seconds: 0.1       # 工具重试退避间隔（秒）
  max_tool_log_chars: 400               # 工具日志截断长度
  # tool_use_system_prompt: "..."       # 注入的工具使用提示
  # provider_error_template: "..."      # Provider 错误消息模板

# ── Agent Runtime（canonical ledger，修复 #24 地基）─────────
# Phase 1：best-effort 把每个 run 的 canonical 事件流与执行回执落库（附加双写，
# 不改对外行为）。reading/重放端属 Phase 5。默认代码里为 false；这里置 true 以采集数据。
agent_runtime:
  canonical_ledger_enabled: true
  # Phase 5：把每个 run 的有序 tool transcript 落到 agent_runs.transcript_json，
  # 下一轮由 TranscriptProjector 投影成成对 tool_use/tool_result 注入历史，
  # 替代被剥离的纯文本叙述（#24 根因）。默认代码里为 false；这里置 true 采集数据。
  # 旧 run（无 transcript_json）自动回退到原文本历史路径。
  transcript_replay_enabled: true

# ── Context Budget ──────────────────────────────────────
# 控制未知模型 fallback 上下文窗口和 reasoning chain 预算。
# 模型声明 providers.*.models[].capabilities.context_window 时优先使用模型窗口。
# 以下均为默认值，不写则使用默认值。
#
# context:
#   max_tokens: 272000                  # 未声明模型窗口时的 fallback context window
#   reserved_tokens: 10000              # 未声明模型窗口时为输出保留的 token
#   # max_chars: null                   # 字符数上限（兼容旧逻辑，优先使用 max_tokens）
#   # reserved_chars: 0                 # 字符保留数
#   summary_max_chars: 2000             # 历史摘要最大字符数
#   reasoning_policy: "budget"          # strip / append / budget
#   max_reasoning_tokens: 2000          # reasoning chain token 预算

# ── Identity / action authorization ──────────────────
# Identity controls Person linking and memory attribution, not tool policy.
# Admins are authenticated account keys assembled from channel + account id;
# being linked to a Person does not make an account an admin.
#
# identity:
#   enabled: false

# Authorization is independent of identity.enabled; default is standard.
# In standard mode, privileged calls fail closed until authorization.admins is explicitly set.
# Admin-only actions always require an account declared in authorization.admins.
# Both relaxed and unsafe execute with the bot OS account — NOT in a sandbox.
# relaxed: allow exec/scripts after independent risk review; unsafe: no review.
# Identity/MCP management, desktop tools and cross-chat delivery remain admin-only.
# Changes require restarting the bot (no policy hot reload in this version).
# authorization:
#   mode: standard
#   admins: ["milky:user:123456789"]
#   # Chat trust domains: chats that share read visibility for history tools.
#   # Unlisted chats remain singletons (current chat only).
#   chat_domains:
#     main_community:
#       - "milky:group:833325688"
#       - "milky:group:732870642"
#   chats:
#     "milky:group:833325688": relaxed
#     "milky:group:732870642": relaxed
#   # accounts:                       # exact account overrides chat/default mode
#   #   "milky:user:987654321": unsafe
#   review:
#     model: cheap                     # model tag or provider/model; must resolve
#     timeout_seconds: 20
#     max_input_chars: 60000           # oversized calls fail; never silently truncated

# ── Builtin plugin overrides（顶层插件 id 覆盖 manifest config）──
# search_files 只读检索工具的根目录白名单：每个发送者可用（无 shell），
# 空 = 不注册该工具。路径必须是 bot 可读的只读参考资料目录。
#
# builtin-commands:
#   file_search_roots:
#     - /home/ecs-user/FrozenProjects

# ── Processes（附属进程监管 / SSH 隧道 / frpc / sidecar）──
# 把需要在服务端常驻的附属进程统一交给 bot 核心监管。
# 关键：这些进程在所有 Channel/插件启用 *之前* 就绪，在它们 *之后* 才收尾，
# 因此适合放需要先于 Channel 建立的 SSH 隧道、frpc、cloudflared 等。
# 进程默认 *不* 继承 bot 进程环境，只有 PATH 等少量白名单 + 你声明的 env 会传入。
# 密钥请放 .env，通过 ${VAR} 引用，不要写明文。
# 详见 docs/design/process-supervisor.md
#
# processes:
#   enabled: true                      # 总开关；false 则不拉起任何进程
#   defaults:                          # 所有 spec 的默认值，可被单项覆盖
#     restart_policy: "on-failure"     # no | on-failure | always
#     backoff_initial_seconds: 1.0     # 崩溃后首次重启等待
#     backoff_max_seconds: 60.0        # 指数退避上限
#     backoff_factor: 2.0
#     restart_max_attempts: 0          # 0=不限；>0 触发熔断（停止自动重启）
#     restart_window_seconds: 300.0    # 统计重启次数的滑动窗口
#     shutdown_timeout_seconds: 10.0   # SIGTERM 后多久 SIGKILL
#     startup_wait_seconds: 0.0        # 启动后等待健康检查的宽限
#     log_buffer_lines: 1000           # stdout/stderr 各自的环形缓冲行数
#   specs:
#     ssh-db-tunnel:
#       command: "ssh -N -L 3306:db.internal:3306 bastion@example.com"
#       shell: true                    # true=走 shell；false=execve（command 是可执行文件，args 是参数列表）
#       env:
#         SSH_KEY_PATH: "${SSH_KEY_PATH}"
#       restart_policy: "always"
#       depends_on: []                 # 同段内其他 spec 名，决定启动顺序（依赖者先就绪）
#       shutdown_timeout_seconds: 8.0
#       health_check:
#         type: "tcp_port"             # tcp_port | none
#         host: "127.0.0.1"
#         port: 3306
#         interval_seconds: 15.0       # 探测间隔
#         timeout_seconds: 3.0         # 单次探测超时
#         unhealthy_after: 3           # 连续失败 N 次才判不健康并触发重启
#         start_period_seconds: 0.0    # 启动宽限期内失败不计入
#     # frpc:
#     #   command: "frpc -c ./frpc.ini"
#     #   restart_policy: "always"
#     #   health_check:
#     #     type: "none"

# ── Scheduler ──────────────────────────────────────────
# 控制定时任务调度行为。
# 以下均为默认值，不写则使用默认值。
#
# scheduler:
#   poll_interval_seconds: 1.0          # 调度轮询间隔（秒）
#   max_concurrent_fires: 5             # 最大并发执行数
#   job_timeout_seconds: 120.0          # 单任务超时（秒）
#   min_interval_seconds: 60            # cron 最小间隔
#   max_prompt_chars: 12000             # 定时任务 prompt 最大字符数
#   max_jobs_per_chat: 20               # 每个会话最大任务数
#   failure_retry_seconds: 300          # 失败重试等待（秒）
#   max_consecutive_failures: 3         # 连续失败上限
#   memory_dreaming_enabled: true       # 是否启用内部记忆 dreaming
#   memory_dreaming_interval_seconds: 3600       # dreaming 周期（秒）
#   memory_dreaming_initial_delay_seconds: 300   # 启动后首次 dreaming 延迟
#   memory_dreaming_session_limit: 20            # 单次最多扫描会话数
#   memory_dreaming_recent_turn_limit: 40        # 单会话最多读取 turns 数
#   memory_dreaming_provider_id: ""     # Legacy；建议改用 memory_dreaming_model
#   memory_dreaming_model: ""           # model spec；空则默认找 memory tag，失败后走会话模型

# ── Router ─────────────────────────────────────────────
# 按聊天入口禁言，默认关闭；管理员可用 /mute 30m、/unmute，/mute status 查看状态。
# mute:
#   enabled: false
#   default_duration_seconds: 3600
#   notice:
#     offline: "Chat muted."
#     online: "Chat unmuted."
#
# 控制消息路由行为。system_prompt 使用顶层 system_prompt 字段。
# 以下均为默认值，不写则使用默认值。
#
# router:
#   # system_prompt: "..."              # 与顶层 system_prompt 重复，优先使用顶层字段
#   max_history_turns: 200              # 最大历史轮数
#   agent_enabled: true                 # 是否启用 Agent
#   command_timeout_seconds: 30.0       # 命令执行超时（秒）
#   command_timeout_message: "Command timed out. Please try again later."
#   reply_to_inbound: true              # 默认是否引用回复触发消息；平台插件可覆盖
#   pending_messages:
#     mode: batch                       # batch / sequential；群聊积压默认合并同发送者连续消息
#     max_messages: 20                  # 每个会话排队的原始消息上限
#     ttl_seconds: 900                  # 排队消息过期时间（秒）
#     batch_max_messages: 6             # 每批最多合并多少条；私聊/命令/steer 独立执行
#     batch_max_chars: 4000             # 每批正文总字符上限；超长单条仍完整执行
#   group_context:
#     enabled: true                     # 是否在触发时注入 observed-only 群上下文
#     max_messages: 20                  # 最多注入最近多少条未触发群消息
#     ttl_seconds: 900                  # 只注入最近 N 秒内的群上下文；0 表示不按时间过滤
#     max_chars: 4000                   # 群上下文注入块最大字符数

# ── Model Tags / Specs ─────────────────────────────────
# providers 的 models 中用 tags 字段标记模型角色：
# primary / cheap / memory / embedding / reranker / vision
# 需要内部模型的配置项都接受一个 model spec 字符串；这个字符串可以是 tag，
# 也可以是 provider/model 或裸模型名。

# ── Memory ─────────────────────────────────────────────
# 长期记忆检索和 embedding 配置。默认只启用 SQLite FTS；vector/hybrid
# 需要显式开启，并在 providers.models 中配置带 embedding tag 的模型。
#
# memory:
#   enabled: true
#   retrieval:
#     fts_enabled: true
#     vector_enabled: false       # 开启后对长期记忆使用 hybrid 检索
#     hybrid_enabled: true
#     vector_backend: json        # json / sqlite-vec / none
#     max_injected_items: 5
#     max_injected_chars: 4000
#   embedding:
#     enabled: false
#     model: ""                   # model spec；空则默认找 embedding tag
#     dimensions: 0               # 0 = auto-detect via probe embed call
#     batch_size: 16
#     embed_after_consolidation: true
#   consolidation:
#     rule_based_enabled: true     # 是否启用每轮对话后的规则抽取；false 时只保留 dreaming/显式写入


# ── TTS 插件（Channel 指令 /speak 与 speak 工具）──────────────────────────
# 复用上面 webapi.speech 的 &tts 锚点，保证两边用同一套后端与音色配置。
tts:
  <<: *tts
  enabled: true
  output_dir: "generated/audio"
  auto_send: true
  command_names:
    - speak
    - 说话
  attachment_type: "voice"
  max_calls_per_24h: 0
