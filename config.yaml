db_path: "./data/nahida.db"

# ── Workspace ─────────────────────────────────────────
workspace_base_dir: "./data/workspace"

# exec / cron 外部命令的专用 Python 虚拟环境（与 bot 自身环境隔离，
# 模型脚本里的 pip install 只影响这里；留空禁用并回退为继承 bot 环境）
exec_venv_path: "./data/exec-venv"

# ── 插件 ──────────────────────────────────────────────
plugin_paths:
  - "./plugins"

# ── Agent / Router ────────────────────────────────────
system_prompt: "You are a helpful assistant."

# ── LLM Providers（dict 格式，key 即 provider id）───
# 默认配置已经是多 provider。每个 provider 有独立的 api_key、base_url 和 models。
# models 的第一个元素是该 provider 的默认模型；每个模型可以是字符串，
# 也可以是 {name, tags, capabilities} 对象。通过 /model 命令可在聊天中切换模型。
#
# 没有配置 api_key 的 provider 会在启动时被跳过；因此可以只填写实际使用的后端。

authorization:
  mode: standard
  # ★ 把你自己的账号设为 admin，standard 模式下也能用全部工具
  admins:
    - "onebot:user:3793157982"          # 你的私聊账号
  # ★ 如果想让整个群都放宽，用这条（按需选择）
  chats:
    "onebot:group:529674493": relaxed   # 该群内可用 exec/脚本，但有审查模型过一遍
  review:
    model: minimax/MiniMax-M2.5         # relaxed 模式下对 exec/脚本做风险审查的模型
    timeout_seconds: 20
    max_input_chars: 60000

providers:
  deepseek-main:
    type: deepseek
    api_key: "sk-1441253510984cff9ec3ec10108fc53b"          # ★ 已填回明文
    base_url: "${DEEPSEEK_LLM_BASE_URL:https://api.deepseek.com}"
    # 内部使用 SSE 接收并聚合，可避免长推理期间普通读超时误判。
    stream_responses: true
    # thinking_enabled: false   # 关闭 DeepSeek thinking mode
    models:
      # ★ 若启动后调用报 model not found / 404，请改为平台真实模型名（如 deepseek-chat / deepseek-reasoner）
      - name: "deepseek-v4-pro"
        tags: [primary]
      - name: "deepseek-v4-flash"

  siliconflow:
    type: "openai-compatible"
    api_key: "sk-cbgtsbrooofoajsoarjavhygdvwcgapvmqlgwrjaizyfibmw"   # ★ 已填回明文
    base_url: "${SILICONFLOW_LLM_BASE_URL:https://api.siliconflow.cn/v1}"
    merge_system_messages: true
    stream_responses: true
    models:
      - name: "Qwen/Qwen3-Embedding-8B"
        tags: [embedding]
      # ★ 模型 ID 请用 curl 核实：curl https://api.siliconflow.cn/v1/models -H "Authorization: Bearer $KEY"
      - name: "Pro/zai-org/GLM-5"
        tags: [vision]
      - name: "Qwen/Qwen3-VL-8B-Instruct"
        tags: [vision]
        capabilities:
          image_input: true
          max_image_count: 4
          max_image_bytes: 10485760

  minimax:
    type: minimax
    api_key: "sk-cp-p6T-GrQIef4STPYiL-92A8hIFs2usCrNKjeK3CtTAbOTAd-PotNl_YDxH7YGXV2JX90DYglOY8UAEMYzqbqnG4-_y-V9KiNkyseeEP7Z9CnSD3UoxfDl8nU"   # ★ 已填回明文
    base_url: "https://api.minimaxi.com/anthropic"
    max_tokens: 16000
    stream_responses: true
    models:
      # ★ 模型 ID 请核实（如 MiniMax-Text-01 等）
      - name: "MiniMax-M3"
      - name: "MiniMax-M2.5"
        tags: [cheap, memory]
      - name: "MiniMax-M2.7"

default_provider: minimax   # 可选，默认使用 providers 中的第一个 key

# ── 多模态 / 图片理解 ─────────────────────────────────
# image_fallback_mode:
#   auto: 主模型不支持 image_input 时，自动调用 fallback vision 模型生成描述
#   tool: 主模型不支持 image_input 时，注入 image_understand 工具，由主模型按需调用
#   off:  不处理图片，只保留普通文本
# media_context_policy:
#   cache_aware: 最近图片尽量保留原生内容块，旧图片降级为描述
#   native_recent: 仅最近图片保留原生内容块
#   description_only: 历史图片只使用描述
multimodal:
  image_fallback_mode: "auto"
  media_context_policy: "cache_aware"
  # ★ 删除了 image_fallback_provider 字段，新版本 Settings 对 multimodal 采用
  #   extra="forbid"，该 Legacy 字段会导致 ValidationError 启动失败。
  #   provider 信息已包含在 image_fallback_model 前缀（siliconflow/...）里。
  image_fallback_model: "siliconflow/Qwen/Qwen3-VL-8B-Instruct"
  max_images_per_turn: 4
  max_image_bytes: 5242880
  media_cache_ttl_seconds: 3600

# ── 插件配置 ──────────────────────────────────────────
# Settings 的 extra="allow" 机制：顶层 key 如果不是已知字段，
# 且值为 dict，则按 plugin id 匹配并注入到对应插件的 manifest.config 中。

builtin-commands:
  # send_local_attachment 默认只允许发送 active workspace 内的相对路径。
  # 如确实需要发送工作区外的本地文件，可打开下面开关。
  allow_external_attachment_paths: false
  # 可选白名单目录；为空表示打开上方开关后允许任意绝对路径。
  # external_attachment_roots:
  #   - "<absolute-directory>"
  external_attachment_roots: []

# ---- MCP servers ----
# Built-in MCP plugin (id=mcp) reads this section from manifest.config.
# servers = static definitions (take priority over the dynamic ones in plugin_data).
# allowed_dynamic_stdio_commands = allowlist for dynamic stdio servers.
mcp:
  servers:
    mihoyo:
      transport: stdio
      command: 'D:\nahida-bot-v2\nahida-bot-2\data\workspace\workspaces\default\mihoyo-mcp\.venv\Scripts\python.exe'
      args: ["-m", "mihoyo_mcp.server"]
      namespace: mihoyo
      enabled: true
  allowed_dynamic_stdio_commands:
    - 'D:\nahida-bot-v2\nahida-bot-2\data\workspace\workspaces\default\mihoyo-mcp\.venv\Scripts\python.exe'

