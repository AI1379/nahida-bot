# Nahida Bot 配置文件
# 参见 nahida_bot.core.config.Settings 了解所有可用字段
#
# ⚠️ 本文件含明文 API Key，请勿提交到 git / 分享给他人。

# ── 应用 ──────────────────────────────────────────────
app_name: "Nahida Bot"
debug: false
log_level: "INFO"        # DEBUG / INFO / WARNING / ERROR（控制台级别）
# log_json: true          # 设为 true 输出 JSON 格式日志（生产环境推荐）
# 可复盘基线（agent-loop 修复 Phase 0）：默认把应用日志落盘到 JSON Lines 文件，
# 文件级别 DEBUG 以便保留 agent_loop.run_completed 的 terminal_state/reason、
# provider 协议异常、context 来源等字段。控制台仍保持 INFO，不被 DEBUG 刷屏。
log_file: "./data/logs/nahida.log"
log_file_level: "DEBUG"
log_file_json: true
# 按文件大小滚动日志：单文件达到 log_file_max_bytes 后轮转，最多保留
# log_file_backup_count 个历史备份（nahida.log.1、nahida.log.2 …）。
# max_bytes=0 表示不滚动（日志文件会无限增长）。默认 10 MiB × 5 份。
log_file_max_bytes: 10485760          # 单个日志文件上限（字节），0 = 不滚动
log_file_backup_count: 5             # 保留的滚动备份数
dependency_log_level: "WARNING"       # 三方库默认日志级别；避免 DEBUG 时被 httpx/websockets 等刷屏
# logger_levels:                      # 可选：按 logger 名覆盖（注意：会同时作用于控制台与文件）
#   nahida_bot.agent: "DEBUG"
#   plugin.rss-notifier: "DEBUG"
#   httpx: "WARNING"

# ── 服务器 ────────────────────────────────────────────
host: "127.0.0.1"
port: 6185

# ★ webapi 端口原为 6185，与主服务冲突；改为 6186
# ★ auth_token 留空 + cors ["*"] 会导致任意网页无认证调用 API，生产环境请填 token 并收窄 cors
onebot:
  enabled: true
  ws_url: "ws://127.0.0.1:3001"
  ws_access_token: ""
  allowed_friends:
    - "3793157982"
  allowed_groups:
    - "529674493"
    - "1102856233"
    # ★ 删除了原文件里混入的中文全角引号行 「- ”“」，YAML 不认会污染配置
  group_context_capture: true        # 让未触发的群消息进入上下文,可被 joiner 使用
  soft_mention_keywords:
    - "雀"
    - "雀儿"
    - "浅色阴影风"
    - "浅色"
    - "浅影风"

# ── 数据库 ────────────────────────────────────────────
webapi:
  enabled: true
  auth_token: ""                       # ★ 建议改成 "${WEBAPI_AUTH_TOKEN:}" 并在 .env 填值
  cors_origins: ["*"]                  # ★ 建议收窄，如 ["http://127.0.0.1:5173"]
  host: "127.0.0.1"
  port: 6186                           # ★ 与主服务 6185 分开
  # GPT-SoVITS 角色音色服务（9882，接口与 IndexTTS 9881 相同）；
  # &tts 锚点供下方 tts 插件复用。要切回 IndexTTS：把 base_url 改回 9881。
  speech: &tts
    enabled: true
    default_backend: gsv
    default_voice: '三月七'
    max_text_length: 300
    max_concurrency: 1
    backends:
      gsv:
        type: indextts-v2            # 复用同一套 HTTP 适配器，协议一致
        base_url: 'http://127.0.0.1:9882'
        timeout_seconds: 300
        lang: 'ZH'
        diffusion_steps: 20
        num_beams: 1
        duration_factor: 1.0
        peak_limit: 0.95
      minimax:
        type: minimax-t2a-v2         # 云端音色；api_key 走 .env 的 MINIMAX_TTS_API_KEY
        api_key: "${MINIMAX_TTS_API_KEY}"
        model: speech-2.8-hd
        timeout_seconds: 120
        audio_format: wav
        sample_rate: 32000
        channel: 1
    voices:
      # 云端青雀：MiniMax 系统音色（克隆/声音设计被当前套餐限制，返回 2061）
      '青雀·云端':
        backend: minimax
        voice_id: 'Chinese (Mandarin)_Gentle_Senior'
        speed: 1.0
        volume: 1.0
        pitch: 0
      '三月七':
        ref_audio: 'D:\vc\models\gsv\v2ProPlus\三月七\reference_audios\中文\emotions\【中立】真可惜！好不容易能来一次不带包袱的旅行…….wav'
        emotions:
          '中立': 'D:\vc\models\gsv\v2ProPlus\三月七\reference_audios\中文\emotions\【中立】真可惜！好不容易能来一次不带包袱的旅行…….wav'
          '厌恶': 'D:\vc\models\gsv\v2ProPlus\三月七\reference_audios\中文\emotions\【厌恶】那个，请问，你…不是，您难道是…….wav'
          '吃惊': 'D:\vc\models\gsv\v2ProPlus\三月七\reference_audios\中文\emotions\【吃惊】呃…倒是没必要闹得那么僵啦，托帕小姐看上去也不是那么不讲理的人。.wav'
          '开心': 'D:\vc\models\gsv\v2ProPlus\三月七\reference_audios\中文\emotions\【开心】你看你看，小家伙有反应了！看来它也很喜欢这个名字～.wav'
