#   collect_enabled: true          # 允许她选择本轮收到的表情图收藏，不会全量收图
#   collect_cooldown_seconds: 30

conversation_joiner:
  # 主动入话题默认关闭。开启前需要对应群频道启用 group_context_capture，
  # 让未触发消息先进入 MessageObserved。
  enabled: true
  model: minimax/MiniMax-M2.5           # 显式锁定秘书模型，避免 cheap tag 命中 deepseek-v4-flash
  threshold: 0.75
  max_context_messages: 12
  max_context_chars: 3000
  cooldown_seconds: 300
  max_triggers_per_hour: 600
  debounce_seconds: 20
  decision_timeout_seconds: 60
  persona_context:
    enabled: true                   # 启用后秘书模型会读取 workspace 中的人设文件辅助判断是否自然入话题
    files:
      - SOUL.md
    max_chars: 4000                 # 注入秘书模型的人设上下文总字符上限
    cache_ttl_seconds: 60           # persona 文件缓存时间，避免每条候选消息都读文件
  prefilter:
    ignore_commands: true
    ignore_mentions: true
    min_text_chars: 4
    keyword_hints: ["雀", "雀儿"]
    sample_rate: 0.8                # 普通候选消息进入秘书模型的采样概率
    keyword_sample_rate: 1.0         # 命中 keyword_hints 后进入秘书模型的采样概率
  groups:
    "onebot:group:529674493":
      enabled: true
  # groups:
  #   milky:group:123456789:
  #     enabled: true
  #     threshold: 0.78
  #     cooldown_seconds: 300
  engagement:
    enabled: true                  # 打开后进入 observing/joining/engaged/cooling 状态机
    join_state_ttl_seconds: 600
    idle_exit_seconds: 180
    max_engaged_seconds: 1800
    response_cooldown_seconds: 45
    engagement_score_alpha: 0.2
    engagement_score_exit_threshold: 0.2
    score_decay_half_life_seconds: 600
    score_decay_floor: 0.0
    batching:
      window_seconds: 8             # 后续群消息进入 batch 的短窗口
      max_messages: 6               # 窗口内消息过多时提前 flush
      max_chars: 2000
      flush_on_mention: true
    continue_gate:
      enabled: true                 # 每个 flushed batch 交给秘书模型判断是否继续接话
      model: minimax/MiniMax-M2.5   # ★ 原来是 cheap，会命中 deepseek-v4-flash；显式锁定
      threshold: 0.55
      min_messages: 1
      evaluate_interval_seconds: 12
    exit_gate:
      enabled: true
      low_value_threshold: 0.35
      low_value_strikes: 22
      min_messages_per_window: 1
      activity_window_seconds: 120

