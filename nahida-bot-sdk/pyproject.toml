[project]
name = "nahida-bot-sdk"
version = "0.1.0"
description = "Public SDK types for nahida-bot plugin development"
readme = "README.md"
license = { text = "WTFPL" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
nahida-scaffold = "nahida_bot_sdk.scaffold:main"
nahida-test-repl = "nahida_bot_sdk.testing.console:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
