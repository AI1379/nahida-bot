id: image_generation
name: "Image Generation"
version: "0.1.0"
description: "Generate images through OpenAI-compatible, MiniMax, or ChatGPT Codex image backends"
entrypoint: "nahida_bot.plugins.image_generation.plugin:ImageGenerationPlugin"
load_phase: "post-agent"
enabled: false
permissions:
  filesystem:
    read:
      - workspace
    write:
      - workspace
  network:
    outbound:
      - "*"
capabilities:
  tools:
    - name: image_generate
      description: Generate images from a text prompt and optionally send them to the current chat
config:
  provider: "default"
  output_dir: "generated/images"
  auto_send: true
  command_names:
    - draw
    - 生图
  caption_template: ""
  max_images_per_24h: 0
  backends:
    default:
      type: "openai-images"
      base_url: "https://api.openai.com/v1"
      api_key: ""
      require_api_key: true
      model: "gpt-image-1"
      size: "1024x1024"
      quality: "auto"
      response_format: ""
      output_format: ""
      timeout_seconds: 120
      download_timeout_seconds: 60
      trust_env: false
      force_close_connections: true
      max_concurrency: 1
      max_images_per_request: 1
      extra_body: {}
    # minimax:
    #   type: "minimax"
    #   base_url: "https://api.minimaxi.com"
    #   api_key: ""
    #   model: "image-01"
    #   aspect_ratio: "1:1"
    #   response_format: "url"
    #   prompt_optimizer: true
    #   timeout_seconds: 120
    #   download_timeout_seconds: 60
    #   force_close_connections: true
    #   max_concurrency: 1
    #   max_images_per_request: 1
config_schema:
  type: object
  properties:
    provider:
      type: string
      default: "default"
      description: Default image generation backend key.
    output_dir:
      type: string
      default: "generated/images"
      description: Workspace-relative directory used to save generated images; created automatically with parents.
    auto_send:
      type: boolean
      default: true
      description: Send generated images to the current chat when the tool is called.
    command_names:
      type: array
      items:
        type: string
      default: ["draw", "生图"]
      description: Slash command name followed by aliases.
    caption_template:
      type: string
      default: ""
      description: Optional attachment caption template with prompt, model, path, revised_prompt.
    max_images_per_24h:
      type: integer
      default: 0
      minimum: 0
      description: Maximum generated image slots allowed in a rolling 24 hour window; 0 disables the limit.
    backends:
      type: object
      description: Image generation backends keyed by provider name.
      additionalProperties:
        type: object
        properties:
          type:
            type: string
            default: "openai-images"
            enum:
              - openai-images
              - minimax
              - codex-images
            description: Backend protocol type.
          provider_id:
            type: string
            default: "codex"
            description: 'Key of the "type: codex" LLM provider whose OAuth token is reused (codex-images backend only).'
          base_url:
            type: string
            default: "https://api.openai.com/v1"
            description: API base URL, without the images path. Defaults differ per backend type (codex-images uses https://chatgpt.com/backend-api/codex).
          api_key:
            type: string
            default: ""
            secret: true
            description: API key for this image backend. Not used by codex-images (it reuses the provider OAuth token).
          require_api_key:
            type: boolean
            default: true
            description: Require a non-empty API key before sending requests. Ignored by codex-images.
          model:
            type: string
            default: "gpt-image-1"
            description: Default image model. codex-images defaults to gpt-image-2.
          size:
            type: string
            default: "1024x1024"
            description: Default image size. codex-images defaults to auto.
          quality:
            type: string
            default: "auto"
            description: Default image quality value passed to the backend.
          background:
            type: string
            default: "auto"
            description: Background override for compatible GPT Image backends (codex-images backend only).
          response_format:
            type: string
            default: ""
            description: Optional response_format override, for example b64_json or url.
          output_format:
            type: string
            default: ""
            description: Optional output format for compatible GPT Image backends.
          timeout_seconds:
            type: number
            default: 120
            minimum: 0.1
          download_timeout_seconds:
            type: number
            default: 60
            minimum: 0.1
          trust_env:
            type: boolean
            default: false
            description: Whether httpx should use proxy and certificate settings from environment variables.
          force_close_connections:
            type: boolean
            default: true
            description: Disable HTTP keepalive and send Connection close for relay compatibility.
          max_concurrency:
            type: integer
            default: 1
            minimum: 1
            maximum: 16
          max_images_per_request:
            type: integer
            default: 1
            minimum: 1
            maximum: 10
          extra_body:
            type: object
            default: {}
            description: Additional admin-controlled request fields sent to this backend.
          aspect_ratio:
            type: string
            default: "1:1"
            enum:
              - "1:1"
              - "16:9"
              - "4:3"
              - "3:2"
              - "2:3"
              - "3:4"
              - "9:16"
              - "21:9"
            description: Image aspect ratio (minimax backend only).
          width:
            type: integer
            default: 0
            minimum: 0
            maximum: 2048
            description: Image width in pixels, must be multiple of 8 (minimax image-01 only). Set 0 to use aspect_ratio.
          height:
            type: integer
            default: 0
            minimum: 0
            maximum: 2048
            description: Image height in pixels, must be multiple of 8 (minimax image-01 only). Set 0 to use aspect_ratio.
          style_type:
            type: string
            default: ""
            description: Style type for image-01-live model (漫画, 元气, 中世纪, 水彩). MiniMax backend only.
          style_weight:
            type: number
            default: 0.8
            minimum: 0.01
            maximum: 1.0
            description: Style weight (0, 1] for image-01-live model. MiniMax backend only.
          seed:
            type: integer
            description: Random seed for reproducible results. MiniMax backend only.
          prompt_optimizer:
            type: boolean
            default: false
            description: Enable prompt auto-optimization. MiniMax backend only.
          aigc_watermark:
            type: boolean
            default: false
            description: Add AIGC watermark to generated images. MiniMax backend only.
