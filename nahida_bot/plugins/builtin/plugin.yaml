id: builtin-commands
name: "Builtin Commands"
version: "0.1.0"
description: "Core commands, workspace tools, exec, web fetch, plan, cron, and agent orchestration"
entrypoint: "nahida_bot.plugins.builtin.commands:BuiltinCommandsPlugin"
enabled: true
config:
  allow_external_attachment_paths: false
  external_attachment_roots: []
  # Read-only directories searchable by the search_files tool (available to
  # every sender, no shell). Empty disables the tool entirely.
  file_search_roots: []
permissions:
  filesystem:
    read:
      - workspace
    write:
      - workspace
  network:
    outbound:
      - "*"
  system:
    subprocess: true
  memory:
    read: true
    write: true
capabilities:
  tools:
    - name: workspace_read
      description: Read a text file from the active workspace
    - name: workspace_write
      description: Write a text file to the active workspace
    - name: send_local_attachment
      description: Send a workspace file to the current chat as an attachment
    - name: memory_read
      description: Search structured durable memory and compatible workspace notes
    - name: memory_write
      description: Create a structured durable memory item
    - name: memory_update
      description: Replace a visible structured memory item
    - name: memory_archive
      description: Archive a visible obsolete or incorrect memory item
    - name: read_chat_history
      description: Read chronological recent, time-range, around-message, or searched chat history
    - name: search_chat_history
      description: Search matching turns across chats and sessions
    - name: find_chat
      description: Resolve a known chat name to a typed chat address
    - name: search_files
      description: Case-insensitive content search over configured read-only roots
    - name: exec
      description: Execute a shell command and return stdout/stderr
    - name: web_fetch
      description: Fetch a web page and return its content as Markdown
    - name: plan
      description: Create and manage task plans for structured work
    - name: agent_spawn
      description: Start a local background subagent task
    - name: agent_wait
      description: Wait for a subagent task result
    - name: agent_list
      description: List subagent tasks for the current session
    - name: agent_stop
      description: Cancel a subagent task
