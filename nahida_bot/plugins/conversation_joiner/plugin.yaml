id: conversation_joiner
name: "Conversation Joiner"
version: "0.1.0"
description: "Observes group context and asks the main agent to naturally join a topic when appropriate"
entrypoint: "nahida_bot.plugins.conversation_joiner.plugin:ConversationJoinerPlugin"
load_phase: "post-agent"
enabled: false
permissions:
  llm_access: true
  filesystem:
    read:
      - workspace
  plugin_data:
    read: true
    write: true
capabilities:
  subscribes_to:
    - MessageObserved
    - MessageReceived
    - MessageSent
    - PokeEvent
  emits:
    - AgentResponseRequested
config:
  # joiner 加载后是否默认对所有群生效。设为 false 则改为逐群 opt-in
  # （在 groups.<chat_key>.enabled 中显式启用）。
  default_group_enabled: true
  model: cheap
  threshold: 0.75
  max_context_messages: 12
  max_context_chars: 3000
  cooldown_seconds: 300
  max_triggers_per_hour: 3
  debounce_seconds: 20
  decision_timeout_seconds: 8
  persona_context:
    enabled: true
    files:
      - SOUL.md
    max_chars: 4000
    cache_ttl_seconds: 60
  prefilter:
    ignore_commands: true
    ignore_mentions: true
    min_text_chars: 4
    keyword_hints: []
    sample_rate: 0.15
    keyword_sample_rate: 1.0
    enable_poke: false
    poke_sample_rate: 0.1
    poke_text_template: "[{poker}] 戳了戳你"
  engagement:
    enabled: false
    join_state_ttl_seconds: 600
    idle_exit_seconds: 180
    max_engaged_seconds: 1800
    response_cooldown_seconds: 45
    engagement_score_alpha: 0.2
    engagement_score_exit_threshold: 0.2
    score_decay_half_life_seconds: 600
    score_decay_floor: 0.0
    batching:
      window_seconds: 8
      max_messages: 6
      max_chars: 2000
      flush_on_mention: true
    continue_gate:
      enabled: true
      model: cheap
      threshold: 0.55
      min_messages: 1
      evaluate_interval_seconds: 8
    exit_gate:
      enabled: true
      low_value_threshold: 0.35
      low_value_strikes: 3
      min_messages_per_window: 1
      activity_window_seconds: 120
  groups: {}
