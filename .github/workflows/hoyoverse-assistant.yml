name: HoYoverse Assistant

on:
  push:
    branches: [v2, develop]
    paths:
      - "plugins/hoyoverse-assistant/**"
      - "nahida-bot-sdk/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/hoyoverse-assistant.yml"
  pull_request:
    branches: [v2, develop]
    paths:
      - "plugins/hoyoverse-assistant/**"
      - "nahida-bot-sdk/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/hoyoverse-assistant.yml"

jobs:
  test:
    name: Plugin checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install plugin dependencies
        run: uv sync --dev --extra hoyoverse-assistant

      - name: Run Ruff
        run: uv run ruff check plugins/hoyoverse-assistant

      - name: Check formatting
        run: uv run ruff format --check plugins/hoyoverse-assistant

      - name: Run Pyright
        run: uv run pyright plugins/hoyoverse-assistant/nahida_plugin_hoyoverse_assistant

      - name: Run plugin tests
        run: uv run pytest plugins/hoyoverse-assistant/tests
