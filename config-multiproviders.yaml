# Nahida Bot 配置文件
# 参见 nahida_bot.core.config.Settings 了解所有可用字段

# ── 应用 ──────────────────────────────────────────────
app_name: "Nahida Bot"
debug: false
log_level: "INFO"        # DEBUG / INFO / WARNING / ERROR
# log_json: true          # 设为 true 输出 JSON 格式日志（生产环境推荐）
# log_file: "./data/logs/nahida.log"  # 可选：把应用日志写入文件，不需要 tee
# log_file_level: "DEBUG"             # 可选：文件日志级别；默认跟随 log_level
# log_file_json: true                 # 文件日志默认使用 JSON Lines

# ── 服务器 ────────────────────────────────────────────
host: "127.0.0.1"
port: 6185

# ── 数据库 ────────────────────────────────────────────
db_path: "./data/nahida.db"

# ── Workspace ─────────────────────────────────────────
workspace_base_dir: "./data/workspace"

# ── 插件 ──────────────────────────────────────────────
plugin_paths:
  - "./plugins"

# ── Agent / Router ────────────────────────────────────
system_prompt: "You are a helpful assistant."

# ── LLM Providers（dict 格式，key 即 provider id）───
# 支持多 provider 配置，每个 provider 有独立的 api_key 和 models 列表。
# models 的第一个元素是该 provider 的默认模型；每个模型可以是字符串，
# 也可以是 {name, capabilities} 对象。通过 /model 命令可在聊天中切换模型。
#
providers:
  deepseek-main:
    type: deepseek
    api_key: "${DEEPSEEK_LLM_API_KEY}"
    base_url: "${DEEPSEEK_LLM_BASE_URL}"
    # 内部使用 SSE 接收并聚合返回，可避免长推理期间普通读超时误判。
    stream_responses: true
    # thinking_enabled: false   # 关闭 DeepSeek thinking mode
    models:
      - name: "deepseek-v4-pro"
        tags: [primary]
      - name: "deepseek-v4-flash"
        tags: [cheap, memory]
  siliconflow:
    type: "openai-compatible"
    api_key: "${SILICONFLOW_LLM_API_KEY}"
    base_url: "${SILICONFLOW_LLM_BASE_URL}"
    merge_system_messages: true
    stream_responses: true
    models:
      - name: "Pro/zai-org/GLM-5"
        tags: [vision]
      - name: "Qwen/Qwen3.6-35B-A3B"
        tags: [vision]
        capabilities:
          image_input: true
          max_image_count: 4
          max_image_bytes: 10485760
  minimax:
    type: minimax
    api_key: "${MINIMAX_LLM_API_KEY}"
    base_url: "https://api.minimaxi.com/anthropic"
    max_tokens: 16000
    stream_responses: true
    models:
      - name: "MiniMax-M2.5"
        tags: [cheap]
      - name: "MiniMax-M2.7"

  # OpenAI Responses API（可选）
  # 使用 /responses 端点，支持内置工具（web_search、image_generation 等）
  # 和有状态对话链（previous_response_id）。Reasoning 摘要可通过
  # reasoning_effort 参数控制深度。
  # stream_responses=true 时同样在 provider 内部流式接收并聚合返回。
  #
  openai:
    type: "openai-responses"
    api_key: "${OPENAI_API_KEY}"
    base_url: "${OPENAI_API_BASE_URL}"
    store_responses: true
    use_previous_response_id: false
    stream_responses: true
    reasoning_effort: "medium"
    # built_in_tools: ["web_search", "image_generation"]
    models:
      - name: "gpt-5.4"
        capabilities:
          image_input: true
          image_generation: true
          web_search: true
          tool_calling: true
          reasoning: true

default_provider: deepseek-main   # 可选，默认使用第一个 key

# ── 多模态 / 图片理解 ─────────────────────────────────
# image_fallback_mode:
#   auto: 主模型不支持 image_input 时，自动调用 fallback vision 模型生成描述
#   tool: 主模型不支持 image_input 时，注入 image_understand 工具，由主模型按需调用
#   off:  不处理图片，只保留普通文本
# media_context_policy:
#   cache_aware: 最近图片尽量保留原生内容块，旧图片降级为描述
#   native_recent: 仅最近图片保留原生内容块
#   description_only: 历史图片只使用描述
multimodal:
  image_fallback_mode: "auto"
  media_context_policy: "cache_aware"
  image_fallback_provider: ""  # Legacy；建议把 provider 写进 image_fallback_model
  image_fallback_model: "siliconflow/Qwen/Qwen3.6-35B-A3B"
  max_images_per_turn: 4
  max_image_bytes: 10485760
  media_cache_ttl_seconds: 3600

# ── 插件配置 ──────────────────────────────────────────
# Settings 的 extra="allow" 机制：顶层 key 如果不是已知字段，
# 且值为 dict，则按 plugin id 匹配并注入到对应插件的 manifest.config 中。

builtin-commands:
  # send_local_attachment 默认只允许发送 active workspace 内的相对路径。
  # 如确实需要发送工作区外的本地文件，可打开下面开关。
  allow_external_attachment_paths: false
  # 可选白名单目录；为空表示打开上方开关后允许任意绝对路径。
  # external_attachment_roots:
  #   - "D:/Pictures"
  external_attachment_roots: []

github-notifier:
  # 目标仓库；保持 OWNER/REPO 时插件会视为未配置，不会启动 webhook/polling。
  repo: "OWNER/REPO"
  # typed chat address 列表，例如 milky:group:123456789 或 telegram:private:123456789。
  target_chat_addresses: []
  webhook:
    enabled: true
    path: "github"                 # 最终路径: /webhooks/github
    secret: "${GITHUB_WEBHOOK_SECRET}"
  polling:
    enabled: true                  # webhook 不可用时的 fallback；首次轮询只建立基线
    interval_seconds: 60
    api_base_url: "https://api.github.com"
    token: "${GITHUB_TOKEN}"       # 私有仓库或更高 rate limit 时填写
  registration:
    enabled: false                 # 开启后可在聊天中使用 /github_watch 动态订阅

conversation_joiner:
  # 主动入话题默认关闭。开启前需要对应群频道启用 group_context_capture，
  # 让未触发消息先进入 MessageObserved。
  enabled: false
  model: cheap                         # model spec；没有 cheap tag 时可改成 provider/model，或留空使用默认模型
  threshold: 0.75
  max_context_messages: 12
  max_context_chars: 3000
  cooldown_seconds: 300
  max_triggers_per_hour: 3
  debounce_seconds: 20
  decision_timeout_seconds: 8
  persona_context:
    enabled: true                   # 启用后秘书模型会读取 workspace 中的人设文件辅助判断是否自然入话题
    files:
      - SOUL.md
    max_chars: 4000                 # 注入秘书模型的人设上下文总字符上限
    cache_ttl_seconds: 60           # persona 文件缓存时间，避免每条候选消息都读文件
  prefilter:
    ignore_commands: true
    ignore_mentions: true
    min_text_chars: 4
    keyword_hints: []
    sample_rate: 0.15                # 普通候选消息进入秘书模型的采样概率
    keyword_sample_rate: 1.0         # 命中 keyword_hints 后进入秘书模型的采样概率
  groups: {}
  # groups:
  #   milky:group:123456789:
  #     enabled: true
  #     threshold: 0.78
  #     cooldown_seconds: 300
  engagement:
    enabled: false                  # 打开后进入 observing/joining/engaged/cooling 状态机
    join_state_ttl_seconds: 600
    idle_exit_seconds: 180
    max_engaged_seconds: 1800
    response_cooldown_seconds: 45
    engagement_score_alpha: 0.2
    engagement_score_exit_threshold: 0.2
    score_decay_half_life_seconds: 600
    score_decay_floor: 0.0
    batching:
      window_seconds: 8             # 后续群消息进入 batch 的短窗口
      max_messages: 6               # 窗口内消息过多时提前 flush
      max_chars: 2000
      flush_on_mention: true
    continue_gate:
      enabled: true                 # 每个 flushed batch 交给秘书模型判断是否继续接话
      model: cheap
      threshold: 0.55
      min_messages: 1
      evaluate_interval_seconds: 8
    exit_gate:
      enabled: true
      low_value_threshold: 0.35
      low_value_strikes: 3
      min_messages_per_window: 1
      activity_window_seconds: 120

telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  # group_trigger_mode: "always"      # none / mention / command / always
  # group_context_capture: false      # mention/command 模式下，是否记录未触发群消息作为上下文
  # reply_to_inbound: null            # true/false 覆盖 router.reply_to_inbound；null/省略表示跟随全局
  # proxy: "${TELEGRAM_PROXY:}"     # SOCKS5/HTTP 代理，如 socks5://127.0.0.1:1080
  # polling_timeout: 30
  # allowed_chats: []

