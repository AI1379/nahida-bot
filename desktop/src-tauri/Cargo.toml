[package]
name = "nahida-desktop"
version = "0.1.0"
description = "Nahida Bot desktop companion shell"
authors = ["Nahida Bot Contributors"]
edition = "2021"

[lib]
name = "nahida_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
